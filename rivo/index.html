:root{--studio-ink:#191743;--primary-blue:#3046df;font-family:Nunito,system-ui,sans-serif;color:var(--studio-ink);background:#fff;font-synthesis:weight}
*{box-sizing:border-box}
body{margin:0}
button,input,select,textarea{font:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button,input,select{color:inherit}
button{border:0;background:none;font-weight:900}
button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid currentColor;outline-offset:2px;box-shadow:0 0 0 6px white,0 0 0 8px #171339;z-index:3}
button:disabled{cursor:default}
h1,h2,h3,p{margin:0}
.ico{width:20px;height:20px;flex:0 0 auto;vertical-align:middle}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
[hidden]{display:none!important}
.dir-a{--main:#3046df;--accent:#ff9652;--ink:#191743;--onmain:#fff;--onaccent:#191743;--deep:#191743;--round:31px;--head:Nunito,system-ui;--boldstyle:normal}
.dir-b{--main:#c8fa38;--accent:#2636af;--ink:#14243d;--onmain:#14243d;--onaccent:#fff;--deep:#14243d;--round:26px;--head:'Rivo Sprint',Nunito;--boldstyle:italic}
.dir-c{--main:#611bd1;--accent:#ff69ab;--ink:#28123b;--onmain:#fff;--onaccent:#28123b;--deep:#28123b;--round:32px;--head:Nunito,system-ui;--boldstyle:normal}
.atelier-wrap{min-height:100dvh;display:grid;grid-template-columns:262px minmax(0,1fr)}
.studio{padding:38px 22px clamp(25px,4vh,50px) 29px;border-right:1px solid #19174324;background:#fff;display:flex;flex-direction:column;gap:26px;align-self:stretch}
.studio-id{display:flex;align-items:center;gap:12px}
.studio-stamp{height:44px;width:44px;border-radius:16px;display:grid;place-items:center;background:#3046df;color:white;box-shadow:inset 0 -4px #19174345;transform:rotate(-6deg)}
.studio-stamp svg{width:27px;height:27px}
.studio-id b{font-size:27px;font-weight:900;letter-spacing:-1.7px;line-height:1}
.studio-id small,.lab-label,.inspector .kicker,.captionlab{font-size:11px;letter-spacing:.09em;text-transform:uppercase;font-weight:900}
.studio-id small{display:block;margin-top:5px}
.lab-label{display:block;margin-bottom:9px}
.directions,.modes{display:grid;gap:5px}
.direction-pick,.mode-btn{min-height:48px;text-align:left;padding:7px 9px;display:flex;align-items:center;gap:11px;border-radius:17px;width:100%;background:white;color:#191743}
.direction-pick[aria-pressed=true],.mode-btn[aria-pressed=true]{box-shadow:inset 0 0 0 2px #191743}
.direction-pick .letter,.letter{color:var(--onmain);background:var(--main);border:1.5px solid var(--ink);border-radius:13px;display:grid;place-items:center;width:37px;height:37px;font:900 19px/1 Nunito}
.direction-pick b,.direction-pick small{display:block;line-height:1.2}.direction-pick small{font-size:12px;font-weight:400;margin-top:2px}
.mode-btn .ico{width:18px}
.lab-fields{display:grid;gap:12px}
.lab-fields label,.dialog-content label.field{display:grid;gap:4px;font-size:12px;font-weight:900}
select,input:not([type=checkbox]){font-size:16px;background:#fff;border:1.5px solid currentColor;border-radius:12px;min-height:44px;padding:7px 11px;min-width:0;max-width:100%}
.lab-fields select{width:100%;font-size:14px;font-weight:900}
.workspace{display:flex;align-items:center;justify-content:center;flex-wrap:nowrap;gap:clamp(28px,4vw,70px);padding:28px clamp(22px,4vw,70px);min-width:0;min-height:100dvh}

/* Electric-blue canvas, molded white panels and solar-yellow actions. */
.dir-a {
  --main: #3046df;
  --accent: #ffda35;
  --ink: #191743;
  --onaccent: #191743;
  --blue-edge: #2335ad;
  --blue-glint: #4356e8;
  --rim: #dce3ff;
  --panel-edge: #c4cef6;
  --panel-well: #edf1ff;
  --panel-face: linear-gradient(180deg, #fff 76%, #f7f8ff);
  --fine-shadow: inset 0 1px 0 #fff, 0 3px 0 var(--panel-edge), 0 7px 13px #13247f40;
  --hero-shadow: inset 0 2px 0 white, 0 5px 0 var(--panel-edge), 0 12px 19px #111f8055;
}

.button-face { display: contents; }
body:not(.with-atelier) .mobile-tools { display: none; }
.phone.dir-a {
  color: white;
  background: var(--main);
  scrollbar-color: #ffffff8c transparent;
}
.dir-a .topbar { min-height: 61px; padding-top: max(5px, env(safe-area-inset-top)); }
.dir-a .topbar .wordmark em { color: var(--accent); }
.dir-a .topbar :is(.avatar-me,.icon-btn) {
  color: var(--ink);
  background: var(--panel-face);
  border: 1px solid var(--rim);
  box-shadow: var(--fine-shadow);
}
.dir-a .topbar .icon-btn { border-radius: 16px; }
.dir-a .context-emblem { color: #fff; }
.dir-a .bottom {
  background: var(--main);
  border-top: 1px solid #ffffff54;
  padding-inline: 9px;
  gap: 4px;
}
.dir-a .bottom button { color: white; border-radius: 18px; }
.dir-a .bottom button[aria-current="page"] {
  color: var(--ink);
  background: var(--panel-face);
  box-shadow: inset 0 1px 0 white, 0 3px 0 var(--panel-edge);
}

/* Keep the full button hitbox fixed. Only the face and its linked reflection move. */
.dir-a .btn:is(.primary,.outline):has(.button-face) {
  --button-face: var(--accent);
  --button-top: #ffe77a;
  --button-lower: #f9ca25;
  --button-edge: #bd8b12;
  --button-glint: #fff7b873;
  --button-text: var(--ink);
  --button-depth: 6px;
  --button-travel: 4px;
  --button-shape-height: 52px;
  --button-size: 62px;
  min-height: var(--button-size);
  padding: 0 0 calc(var(--button-depth) + 1px);
  border: 0;
  border-radius: 23px;
  background: none;
  color: var(--button-text);
  box-shadow: none;
  transform: none;
}
.dir-a .btn.outline:has(.button-face) {
  --button-face: #fff;
  --button-top: #fff;
  --button-lower: #edf1ff;
  --button-edge: var(--panel-edge);
  --button-glint: #ffffff70;
  --button-depth: 3px;
  --button-travel: 2px;
  --button-shape-height: 43px;
  --button-size: 47px;
  border-radius: 17px;
}
.dir-a .btn.outline.selected:has(.button-face) {
  --button-face: #fff2b6;
  --button-lower: #ffe783;
  --button-edge: #d6af29;
}
.dir-a .btn:is(.primary,.outline) > .button-face {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 9px;
  width: 100%;
  min-height: var(--button-shape-height);
  padding: 9px 11px;
  border: 1px solid #19174328;
  border-radius: inherit;
  position: relative;
  isolation: isolate;
  background: linear-gradient(180deg, var(--button-top), var(--button-face) 40%, var(--button-lower));
  box-shadow: inset 0 1px 0 #ffffff89, 0 var(--button-depth) 0 var(--button-edge), 0 9px 9px #1917432a;
  transition: transform 140ms cubic-bezier(.22,.74,.2,1), box-shadow 140ms ease;
  overflow: hidden;
}
.dir-a .btn:is(.primary,.outline) > .button-face::before {
  content: "";
  position: absolute;
  z-index: -1;
  inset: 4px 11% auto;
  height: 13px;
  border-radius: 50% 50% 42% 42%;
  background: linear-gradient(180deg, var(--button-glint), transparent);
  transition: opacity 140ms ease, transform 140ms ease;
  pointer-events: none;
}
.dir-a .btn:is(.primary,.outline):is(:active,.is-pressed):not(:disabled) > .button-face {
  transform: translateY(var(--button-travel));
  box-shadow: inset 0 1px 2px #1917432a, 0 calc(var(--button-depth) - var(--button-travel)) 0 var(--button-edge), 0 3px 4px #1917431f;
  transition-duration: 0ms;
}
.dir-a .btn:is(.primary,.outline):is(:active,.is-pressed):not(:disabled) > .button-face::before {
  transform: translateY(2px) scaleY(.63);
  opacity: .59;
  transition-duration: 0ms;
}
.dir-a .btn.primary:has(.button-face):disabled:not([aria-busy=true]) {
  --button-face: #ffffff;
  --button-top: #ffffff;
  --button-lower: #f2f4ff;
  --button-edge: #e2e6f9;
}
.dir-a .challenge-action,
.dir-a .result-action { font-size: 18px; }

.league-context { margin: 1px 0 15px; }
.context-heading { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.context-heading h1 { font-size: 17px; letter-spacing: -.025em; }
.context-heading .invite-link {
  min-height: 44px;
  padding: 7px 4px 7px 9px;
  color: white;
  gap: 5px;
}
.invite-link .ico { width: 15px; height: 15px; }
.league-trigger {
  display: grid;
  grid-template-columns: 36px 1fr 27px;
  align-items: center;
  gap: 9px;
  padding: 7px 10px 7px 8px;
  min-height: 53px;
  width: 100%;
  color: var(--ink);
  background: var(--panel-face);
  border: 1px solid var(--rim);
  box-shadow: var(--fine-shadow);
  border-radius: 17px;
  text-align: left;
}
.league-trigger > strong { font-size: 16px; overflow-wrap: anywhere; }
.league-token, .social-token {
  display: grid;
  place-items: center;
  width: 35px;
  height: 34px;
  border-radius: 12px;
}
.league-token {
  background: var(--main);
  color: white;
  box-shadow: inset 0 1px 0 #ffffff3b, 0 2px 0 var(--blue-edge);
}
.league-token .ico { width: 17px; height: 17px; }
.league-change { justify-self: end; color: var(--ink); }
.league-change .ico { width: 19px; height: 19px; }
.rebond-challenge,
.dir-a .finish,
.dir-a .league-banner,
.dir-a .rule-sheet,
.dir-a .profile-hero {
  position: relative;
  isolation: isolate;
  color: var(--ink);
  background: var(--panel-face);
  border: 1px solid var(--rim);
  border-radius: 31px;
  box-shadow: var(--hero-shadow);
}
.rebond-challenge {
  background: radial-gradient(ellipse at 92% 12%, #eff2ff 0%, transparent 57%), var(--panel-face);
  padding: 14px 15px 13px;
  margin-bottom: 24px;
}
.challenge-caption {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: var(--ink);
  background: var(--panel-well);
  border: 1px solid var(--rim);
  padding: 5px 9px;
  border-radius: 30px;
  font-size: 11px;
  line-height: 1.15;
  font-weight: 900;
  letter-spacing: .045em;
  text-transform: uppercase;
  position: relative;
  z-index: 2;
}
.challenge-caption .ico { width: 13px; height: 13px; }
.challenge-display {
  display: grid;
  grid-template-columns: minmax(0,57%) minmax(0,43%);
  align-items: center;
  min-height: 152px;
  margin-bottom: 3px;
}
.challenge-copy {
  position: relative;
  z-index: 2;
  padding-bottom: 2px;
}
.challenge-copy h2 {
  font: 900 37px/.98 Nunito,system-ui,sans-serif;
  letter-spacing: -.075em;
}
.duel-target { margin-top: 12px; }
.duel-target span { font-size: 13px; font-weight: 900; display: block; }
.duel-target strong { display: block; margin-top: 1px; }
.duel-time {
  font: 900 38px/.98 Nunito,system-ui,sans-serif;
  font-variant-numeric: tabular-nums;
  letter-spacing: -.055em;
  white-space: nowrap;
}
.duel-message { font-size: 20px; }
.mascot-scene { position: relative; height: 148px; align-self: end; }
.mascot-scene::before {
  content: "";
  position: absolute;
  inset: 12px -9px 6px 1px;
  border-radius: 46% 48% 41% 47%;
  background: radial-gradient(ellipse at center, #dce5ff, #f3f6ff 65%, #f9faff 86%);
}
.scene-frog {
  position: absolute;
  width: 111%;
  height: 96%;
  right: -4px;
  bottom: 15px;
  z-index: 1;
  object-fit: contain;
  object-position: right bottom;
  filter: drop-shadow(2px 4px 3px #14227e55);
}
.scene-shadow {
  position: absolute;
  inset: auto -5px 12px 0;
  height: 15px;
  border-radius: 50%;
  background: #2436a54f;
  filter: blur(5px);
}
.scene-ledge {
  position: absolute;
  z-index: 2;
  inset: auto -8px 17px 2px;
  height: 21px;
  border-radius: 16px 27px 17px 23px;
  background: linear-gradient(180deg,#6475f6,var(--blue-glint) 38%,var(--blue-edge));
  box-shadow: inset 0 1px 0 #ffffff55, 0 5px 7px #17268d7d;
  transform: rotate(-3deg);
}
.scene-wagon {
  position: absolute;
  z-index: 3;
  bottom: 2px;
  right: -7px;
  width: 58%;
  max-width: 84px;
  filter: drop-shadow(3px 5px 3px #14227e81);
}
.challenge-status { font-size: 14px; font-weight: 900; margin: -5px 0 9px; }
.challenge-facts {
  display: flex;
  align-items: center;
  justify-content: center;
  flex-wrap: wrap;
  gap: 3px 15px;
  font-size: 12px;
  font-weight: 900;
  margin-top: 4px;
}
.challenge-facts span { display: inline-flex; align-items: center; gap: 5px; }
.challenge-facts .ico { width: 13px; height: 13px; }
.dir-a .is-complete .challenge-action.btn.primary {
  --button-face: #fff;
  --button-top: white;
  --button-lower: #e5ebff;
  --button-edge: var(--panel-edge);
  --button-glint: #ffffff73;
}
.league-social h2 { font-size: 19px; letter-spacing: -.04em; }
.league-social .subsection { min-height: 22px; margin-bottom: 8px; }
.league-social .member-count { color: white; }
.community-links { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.community-link {
  min-width: 0;
  min-height: 80px;
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: center;
  align-content: center;
  text-align: left;
  gap: 7px 4px;
  padding: 8px 11px 9px;
  color: var(--ink);
  background: var(--panel-face);
  border: 1px solid var(--rim);
  border-radius: 20px;
  box-shadow: var(--fine-shadow);
}
.community-link > strong { grid-row: 2; grid-column: 1 / -1; font-size: 13px; }
.community-link > .ico { color: var(--main); width: 15px; height: 15px; grid-row: 1; grid-column: 2; }
.social-token { background: #eff2ff; color: var(--main); }
.social-token .ico { width: 18px; height: 18px; }

/* Profile and game banners reuse the same inset cradle as the record thumbnails. */
.dir-a .league-banner {
  min-height: 115px;
  padding: 13px 13px 13px 17px;
  gap: 9px;
}
.dir-a .league-banner .banner-art,
.dir-a .profile-art {
  display: grid;
  place-items: center;
  background: radial-gradient(ellipse at 52% 40%, #f9faff, #dce5ff);
  box-shadow: inset 0 2px 4px #6677c229, 0 1px 0 #fff;
  border-radius: 23px;
}
.dir-a .league-banner .banner-art { width: 36%; min-height: 83px; padding: 7px; }
.dir-a .league-banner .toy-art { width: min(100%, 108px); max-height: 88px; object-fit: contain; }
.dir-a .league-banner .kicker,
.dir-a .finish .kicker { color: var(--ink); }
.dir-a .league-banner h2 { margin: 5px 0 4px; }
.dir-a .world-banner h2 { font-size: 33px; }
.dir-a .league-action { margin: 12px 0 0; }
.dir-a .league-action + .duo { margin-top: 5px; }

.dir-a .rule-sheet { padding: 11px 12px 8px; margin: 0 0 15px; }
.dir-a .rule-illustration {
  min-height: 149px;
  margin-bottom: 12px;
  border: 0;
  border-radius: 23px;
  background: radial-gradient(ellipse at 58% 28%, #fff, #e1e8ff 70%);
  box-shadow: inset 0 2px 5px #6677c22e;
}
.rule-illustration .toy-art {
  width: 124px;
  max-width: 43%;
  margin: 0 64px 0 0;
  filter: drop-shadow(4px 8px 6px #13247f4a);
}
.rule-shapes { position: absolute; right: 11px; bottom: 13px; display: flex; gap: 5px; }
.rule-shapes span {
  display: grid;
  place-items: center;
  width: 31px;
  height: 34px;
  border-radius: 11px;
  color: var(--ink);
  background: white;
  box-shadow: var(--fine-shadow);
}
.rule-shapes .ico { width: 15px; height: 15px; }
.dir-a .rule-sheet h2,
.dir-a .rule-sheet .intro-rule { padding-inline: 3px; }

/* The rail ends and the three dock buttons share the same grid on the tray. */
.track-title { margin-bottom: 4px; }
.track-instruction { font-size: 14px; margin: 0 0 13px; }
.round-summary {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin: 0 0 10px;
  gap: 12px;
}
.round-summary strong { font-size: 14px; }
.round-progress { display: flex; gap: 4px; margin-top: 4px; }
.round-progress b {
  min-width: 22px;
  height: 6px;
  border-radius: 10px;
  background: #ffffff42;
}
.round-progress .counted { background: white; }
.round-progress .current { background: var(--accent); }
.round-timer {
  background: #fff;
  border: 1px solid var(--rim);
  box-shadow: 0 2px 0 var(--rim);
  border-radius: 14px;
  padding: 7px 10px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: var(--main);
}
.round-timer .ico { width: 16px; height: 16px; }
.round-timer b { font-size: 17px; color: var(--ink); }
.rebond-playfield {
  --turn-angle: 0deg;
  background: radial-gradient(ellipse at 48% 9%, #f8faff, #dee7ff 79%);
  color: var(--ink);
  border: 4px solid white;
  border-radius: 31px;
  box-shadow: inset 0 2px 5px #8294d063, var(--hero-shadow);
  padding: 11px 11px 14px;
}
.wagon-title {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  border-radius: 16px;
  padding: 5px 9px;
  font-weight: 900;
  font-size: 12px;
  background: white;
  color: var(--ink);
  box-shadow: 0 2px 0 var(--panel-edge);
}
.wagon-title .ico { width: 14px; height: 14px; color: var(--main); }
.toy-tracks { display: block; width: 100%; height: auto; margin-top: -8px; }
.toy-tracks > g.track-rails path, .toy-tracks > .active-route { fill: none; stroke-linecap: round; stroke-linejoin: round; }
.rail-base { stroke: #acbaf0; stroke-width: 25; opacity: .82; }
.rail-lip { stroke: #fcfdff; stroke-width: 19; }
.rail-groove { stroke: #546bcc; stroke-width: 13; }
.rail-dashes { stroke: #8093ed; stroke-width: 9; stroke-linecap: butt; stroke-dasharray: 2 11; }
.active-route { stroke: var(--accent); stroke-width: 4.8; visibility: hidden; }
.rebond-playfield[data-choice="circle"] .active-route[data-route="circle"],
.rebond-playfield[data-choice="triangle"] .active-route[data-route="triangle"],
.rebond-playfield[data-choice="square"] .active-route[data-route="square"] { visibility: visible; }
.switch-pin { fill: #2034a5; stroke: #f2f5ff; stroke-width: 2; }
.switch-arm {
  transform-origin: 150px 83px;
  transform: rotate(var(--turn-angle));
  transition: transform 105ms cubic-bezier(.26,.6,.24,1);
}
.switch-arm path { stroke: #ffffff; stroke-width: 6px; stroke-linecap: round; }
.switch-arm circle { fill: #dfe6ff; }
.track-shadow { fill: #15267b; opacity: .64; }
.wagon-mark { fill: white; stroke: #c9d5ff; stroke-width: .8; }
.track-wagon > svg { fill: #191743; }

.dock-controls {
  margin: -2px 0 0;
  display: grid;
  grid-template-columns: repeat(3,minmax(0,1fr));
  gap: 6px;
}
.dock-control {
  min-width: 0;
  min-height: 68px;
  display: grid;
  padding: 0 0 5px;
  align-items: stretch;
  border-radius: 16px;
  position: relative;
}
.dock-face {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  color: var(--ink);
  min-height: 60px;
  padding: 3px;
  border-radius: inherit;
  background: linear-gradient(180deg,#fff 70%,#e8edff);
  border: 1px solid #d9e2ff;
  box-shadow: 0 5px 0 #aebcf1, 0 8px 10px #172b8a45, inset 0 2px 0 #fff;
  transition: transform 130ms ease, box-shadow 130ms ease;
}
.dock-face > .ico { width: 19px; height: 19px; color: var(--main); }
.dock-face strong { font-size: 12px; }
.dock-control:is(:active,.is-pressed):not([aria-disabled="true"]) .dock-face {
  transform: translateY(3px);
  box-shadow: 0 2px 0 #a0afea, inset 0 2px 0 #dce6ff;
  transition-duration: 0ms;
}
.dock-control[data-verdict] .dock-face {
  box-shadow: 0 2px 0 #a0afea, 0 0 0 2px white, inset 0 0 0 3px var(--main);
}
/* The outer rim catches the light when the wagon reaches its dock. */
.rebond-playfield[data-arrived] .dock-control[data-verdict] .dock-face {
  box-shadow: 0 2px 0 #a0afea, 0 0 0 2px white, 0 0 0 5px #a7b4ff, inset 0 0 0 3px var(--main);
}
.dock-control[data-verdict="incorrect"] .dock-face { border: 2px dashed var(--ink); }
.dock-verdict {
  position: absolute;
  display: none;
  place-items: center;
  right: -4px;
  top: -6px;
  width: 23px;
  height: 23px;
  color: white;
  background: var(--blue-edge);
  border-radius: 9px;
  border: 1.5px solid white;
}
.dock-verdict .ico { width: 13px; height: 13px; }
.dock-control[data-verdict] .dock-verdict { display: grid; }
.dock-control[data-verdict="incorrect"] .dock-verdict { background: var(--ink); }
.rebond-feedback { margin: 11px 0 3px; min-height: 36px; }
.rebond-feedback[data-verdict] > .ico {
  border-radius: 50%;
  background: white;
  color: var(--ink);
  padding: 3px;
  width: 22px;
  height: 22px;
}
.dir-a .game-total { border-color: #ffffff59; }

/* Results and records use smaller parts of the same plastic visual vocabulary. */
.dir-a .finish { min-height: 150px; margin-bottom: 18px; overflow: hidden; }
.dir-a .finish h2 { font-size: 38px; line-height: .95; }
.dir-a .finish .kicker { font-size: 10px; }
.dir-a .finish-type > strong { font-size: 16px; margin-top: 4px; }
.dir-a .finish-type > p { margin-top: 8px; font-size: 13px; }
.dir-a .finish-art { width: 37%; align-self: end; }
.dir-a .finish-art .frog { width: 108%; z-index: 1; filter: drop-shadow(3px 4px 3px #16246a99); }
.reaction-perch {
  position: absolute;
  inset: auto -8px -5px 0;
  height: 20px;
  border-radius: 50%;
  background: #b4bef152;
  filter: blur(2px);
}
.dir-a .finish-art::before {
  content: "";
  position: absolute;
  inset: 1px -12px -1px;
  border-radius: 56% 54% 48% 39%;
  background: radial-gradient(ellipse at center, #dbe5ff 10%, #f9fbff 80%);
}
.dir-a :is(.score-pair > div,.score-list,.review,.empty,.ui-error) {
  color: var(--ink);
  background: var(--panel-face);
  border: 1px solid var(--rim);
  box-shadow: var(--fine-shadow);
}
.dir-a .ui-error { border: 2px dashed var(--ink); }
.dir-a .score-list li + li { border-color: var(--rim); }
.dir-a .score-list li.you {
  color: var(--ink);
  background: #edf1ff;
  font-weight: 900;
}
.dir-a .score-list li.you .place {
  background: white;
  border-color: var(--ink);
  box-shadow: 0 2px 0 var(--panel-edge);
}
.result-remaining { text-align: center; font-size: 12px; font-weight: 900; margin-top: 0; }

.records-title { margin: 8px 0 12px; }
.record-toolbar { display: flex; align-items: center; gap: 8px; justify-content: space-between; margin: 8px 0 9px; }
.record-toolbar > span {
  font-weight: 900;
  font-size: 12px;
  display: inline-flex;
  align-items: center;
  gap: 4px;
}
.record-toolbar > span .ico { width: 14px; height: 14px; }
.record-toolbar .select-game { display: block; margin: 0; max-width: 52%; min-width: 0; }
.record-toolbar .select-game select { min-height: 44px; font-size: 12px; font-weight: 900; }
.dir-a .record-toolbar .select-game select {
  color: var(--ink);
  background: white;
  border-color: var(--rim);
  box-shadow: 0 2px 0 var(--panel-edge);
}
.dir-a .levels { margin-bottom: 5px; }
.dir-a .levels button {
  color: var(--ink);
  background: var(--panel-face);
  border-color: var(--rim);
  border-radius: 15px;
  box-shadow: 0 3px 0 var(--panel-edge);
}
.dir-a .levels button[aria-pressed="true"] {
  background: var(--accent);
  border-color: #ffe67d;
  box-shadow: 0 3px 0 #b7871d;
}
.record-card:first-child, .record-card { background: #fff; color: var(--ink); }
.dir-a .record-card {
  border: 1px solid var(--rim);
  border-radius: 20px;
  overflow: visible;
  background: var(--panel-face);
  box-shadow: var(--fine-shadow);
}
.records { gap: 10px; }
.record-open {
  display: grid;
  grid-template-columns: 49px minmax(0,1fr) auto;
  gap: 9px;
  min-height: 70px;
  padding: 7px 9px;
  border-radius: inherit;
}
.record-thumb {
  display: grid;
  place-items: center;
  width: 49px;
  height: 49px;
  background: radial-gradient(ellipse at 46% 37%, #f8faff, #dde6ff);
  border-radius: 13px;
  box-shadow: inset 0 1px 3px #6677c225;
}
.record-thumb .toy-art, .record-thumb svg { width: 88%; height: 88%; object-fit: contain; }
.record-copy strong { font-size: 15px; overflow-wrap: anywhere; }
.record-metric { display: flex; flex-direction: column; gap: 2px; margin-top: 3px; }
.record-metric small, .record-ranking small { font-size: 10px; line-height: 1.09; font-weight: 900; }
.record-metric b { display: block; letter-spacing: -.04em; font-size: 13px; overflow-wrap: anywhere; }
.record-ranking {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  justify-content: center;
  gap: 3px;
  min-width: 0;
  color: var(--ink);
}
.record-ranking b {
  border: 1px solid #dce4ff;
  color: var(--ink);
  background: var(--panel-well);
  padding: 4px 6px;
  border-radius: 9px;
  white-space: nowrap;
  font-size: 13px;
  letter-spacing: -.045em;
}

.dir-a .profile-hero {
  gap: 15px;
  padding: 11px;
  margin-bottom: 15px;
}
.dir-a .profile-art { width: 109px; height: 101px; flex-shrink: 0; border-radius: 26px; }
.dir-a .profile-art img { width: 91%; height: 92%; filter: drop-shadow(3px 4px 4px #23378f50); }
.dir-a .profile-copy { min-width: 0; overflow-wrap: anywhere; }
.dir-a .profile-copy small { margin-top: 3px; font-weight: 900; }
.dir-a .link-row {
  background: var(--panel-face);
  color: var(--ink);
  border: 1px solid var(--rim);
  border-radius: 20px;
  box-shadow: var(--fine-shadow);
  min-height: 61px;
}
.dir-a .link-row .tile-icon {
  color: var(--ink);
  background: var(--panel-well);
  box-shadow: inset 0 1px 2px #6677c23a;
}
.dir-a .row-copy small { line-height: 1.33; }
.dir-a .chat-stream { padding: 2px 1px 7px; gap: 12px; }
.dir-a .chat-bubble {
  background: var(--panel-face);
  color: var(--ink);
  border: 1px solid var(--rim);
  border-radius: 22px 22px 22px 7px;
  box-shadow: var(--fine-shadow);
  padding: 10px 13px;
}
.dir-a .chat-bubble.mine {
  background: #eef2ff;
  border-radius: 22px 22px 7px 22px;
}
.dir-a .chat-frog { width: 83px; height: 83px; margin: 3px auto 0; filter: drop-shadow(0 3px 3px #23378f3b); }
.dir-a .chat-actions { align-items: center; gap: 8px; }
.dir-a .chat-actions form {
  align-items: center;
  border-radius: 19px;
  padding: 3px;
  background: white;
  box-shadow: var(--fine-shadow);
}
.dir-a .chat-actions input {
  color: var(--ink);
  height: 44px;
  min-width: 0;
  border: 0;
  background: transparent;
}
.dir-a .chat-actions .send {
  color: var(--ink);
  background: var(--accent);
  border-radius: 15px;
  box-shadow: inset 0 1px 0 #fffabb, 0 2px 0 #be911a;
}

#modal[data-theme="a"] {
  background: #3046df;
  border: 1px solid #b6c5ff91;
  border-radius: 27px;
  box-shadow: 0 6px 0 #1e30a2, 0 18px 42px #0e174988;
}
#modal[data-theme="a"]::backdrop { background: #101a60a3; }
.dialog-inner.dir-a { color: white; }
.dialog-inner.dir-a .dialog-header .icon-btn {
  color: var(--ink);
  background: var(--panel-face);
  border-radius: 15px;
  box-shadow: var(--fine-shadow);
}
.dialog-inner.dir-a :is(.manage-list button,.checkline,.sticker-choices button,.field input,.field select,code.invite) {
  background: var(--panel-face);
  color: var(--ink);
  border: 1px solid var(--rim);
  border-radius: 16px;
  box-shadow: 0 2px 0 var(--panel-edge);
}
.dialog-inner.dir-a .manage-list button[aria-current="true"],
.dialog-inner.dir-a .sticker-choices button[aria-pressed="true"] {
  background: #fff0aa;
  border-color: var(--accent);
  box-shadow: 0 2px 0 #d0aa31, inset 0 0 0 1px #d0aa31;
}
.dialog-inner.dir-a .sticker-choices button { padding-bottom: 8px; }
.dialog-inner.dir-a .checkline input { accent-color: var(--ink); }
.dialog-inner.dir-a code.invite { padding: 13px 9px; }
.dialog-inner.dir-a .dialog-message { margin-top: 8px; }
.dialog-inner.dir-a .dialog-message:empty { display: none; }
.phone.dir-a :is(button, select, input, summary):focus-visible,
.dialog-inner.dir-a :is(button, select, input, summary):focus-visible {
  outline: 2px solid white;
  outline-offset: 2px;
  box-shadow: 0 0 0 5px var(--ink);
}

@media (max-width: 740px) {
  body:not(.with-atelier):not(.capture) .phone { height: 100dvh; }
  body.rebond-stage:not(.capture) .atelier-wrap { background: #3046df; }
}
@media (max-width: 365px) {
  .dir-a .content { padding-inline: 13px; }
  .dir-a .topbar { min-height: 55px; padding-inline: 13px; }
  .league-context { margin-bottom: 12px; }
  .rebond-challenge { padding: 12px 12px 11px; border-radius: 28px; margin-bottom: 21px; }
  .challenge-display { min-height: 134px; }
  .challenge-copy h2 { font-size: 31px; }
  .duel-time { font-size: 33px; }
  .mascot-scene { height: 126px; }
  .scene-wagon { right: -5px; }
  .community-link { padding-inline: 9px; }
  .dir-a .finish h2 { font-size: 32px; }
  .record-open { grid-template-columns: 42px minmax(0,1fr) auto; gap: 6px; padding-inline: 7px; }
  .record-thumb { width: 42px; height: 44px; }
  .record-copy strong { font-size: 14px; }
  .record-metric b { font-size: 12px; }
  .record-ranking b { font-size: 12px; }
  .dir-a .world-banner h2 { font-size: 28px; }
  .dir-a .rule-illustration { min-height: 133px; }
  .dir-a .profile-art { width: 96px; height: 92px; }
}

body.reduce .dir-a .btn:is(.primary,.outline):is(:active,.is-pressed) .button-face,
body.reduce .dock-control:is(:active,.is-pressed) .dock-face { transform: none; outline: 2px solid currentColor; outline-offset: -5px; }
body.reduce .dir-a .btn:is(.primary,.outline):is(:active,.is-pressed) .button-face::before { transform: none; }
@media (prefers-reduced-motion: reduce) {
  .dir-a .btn:is(.primary,.outline):is(:active,.is-pressed) .button-face,
  .dock-control:is(:active,.is-pressed) .dock-face { transform: none; outline: 2px solid currentColor; outline-offset: -5px; }
  .dir-a .btn:is(.primary,.outline):is(:active,.is-pressed) .button-face::before { transform: none; }
}

<body>
<div class="mobile-tools" id="mobile-tools"></div>
<div class="atelier-wrap">
  <aside class="studio" aria-label="Atelier du prototype" id="studio"></aside>
  <main class="workspace" id="workspace" aria-label="Aperçu interactif">
    <div id="stage"></div><aside id="inspector" class="inspector" aria-label="Direction artistique"></aside>
  </main>
</div>
<dialog id="modal" aria-labelledby="dialog-title"></dialog>
<div class="sr" id="announcement" role="status" aria-live="polite"></div>
<noscript>Active JavaScript pour essayer le prototype Rivo.</noscript>
<script>/* Six original mechanic diagrams, drawn in the same toy vocabulary as the UI.
   Everything inside the returned SVG is decorative; the caller supplies the game name. */
(() => {
  'use strict';

  const palettes = {
    a: { base: '#3046DF', accent: '#DDE4FF', ink: '#191743' },
    b: { base: '#2636AF', accent: '#C8FA38', ink: '#14243D' },
    c: { base: '#611BD1', accent: '#FF69AB', ink: '#28123B' }
  };

  function illustrate(game, theme, mode = 'banner') {
    const direction = Object.hasOwn(palettes, theme) ? theme : 'a';
    const { base, accent, ink } = palettes[direction];
    const white = '#FFFFFF';
    const outline = direction === 'c' ? 3.2 : 2.7;
    const path = (d, fill = 'none', stroke = 'none', width = 0, extra = '') =>
      `<path d="${d}" fill="${fill}" stroke="${stroke}" stroke-width="${width}" ${extra}/>`;
    const rim = (d, fill) => path(d, fill, ink, outline);
    const line = (d, fill, w, extra = '') => path(d, 'none', fill, w, extra);
    const oval = (x, y, rx, ry, fill, stroke = 'none', w = 0, extra = '') =>
      `<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" fill="${fill}" stroke="${stroke}" stroke-width="${w}" ${extra}/>`;
    const dot = (x, y, r, fill, stroke = 'none', w = 0) => oval(x,y,r,r,fill,stroke,w);
    const group = (transform, parts) => `<g transform="${transform}">${parts}</g>`;
    const shine = (d) => direction === 'a' ? line(d, white, 2.7) : '';
    const speed = (d) => direction === 'b' ? line(d, ink, 2.4) : '';
    const shade = (d) => path(d, ink, 'none', 0, 'opacity=".18"');
    const ground = (x, y, rx) => oval(x, y, rx, 4, ink, 'none', 0, 'opacity=".13"');
    const pin = (x, y, face) => dot(x, y, 3, white, ink, 1.45) + dot(x, y, 1, face);
    const spark = (x, y, size, fill = white) => group(`translate(${x} ${y}) scale(${size})`,
      path('M0-8 Q1-1 8 0 Q1 1 0 8 Q-1 1-8 0 Q-1-1 0-8Z', fill, ink, 1.3));
    const stamp = (x, y, angle, size = 1) => {
      const mark = direction === 'b'
        ? path('M-6 3l4-7h3l-4 7zm6 0 4-7h3L3 3z', ink)
        : direction === 'c'
          ? dot(-5, -2, 1.4, ink) + dot(0, -2, 1.4, ink) + dot(5, -2, 1.4, ink) + dot(-2.5, 2, 1.4, ink) + dot(2.5, 2, 1.4, ink)
          : '';
      return group(`translate(${x} ${y}) rotate(${angle}) scale(${size})`, mark);
    };
    const checker = (x, y, size) => group(`translate(${x} ${y}) scale(${size})`,
      path('M0 0H5V5H0ZM5 5H10V10H5ZM10 0H15V5H10ZM15 5H20V10H15Z', ink));
    // These accents sit beyond the mechanic, so the silhouette is legible at thumbnail size.
    function marginMark() {
      if (mode === 'hero') return '';
      if (direction === 'a') return spark(220, 24, .64) + oval(21, 75, 3.5, 3.5, accent, ink, 1.6);
      if (direction === 'b') return group('translate(18 22) skewX(-24)', line('M0 0h19m-14 6h11', accent, 3.4)) + checker(205, 83, .62);
      return group('translate(19 24) rotate(-10)', path('M0 0l8-3 4 5-8 3z', accent, ink, 1.3)) +
        group('translate(211 76)', dot(0, 0, 2.2, white, ink, 1) + dot(6, 6, 2.2, white, ink, 1));
    }

    function aiguillage() {
      // One incoming pair of rails splits into two berths. A little angled wagon occupies the switch.
      const left = 'M31 87 C55 77 86 65 105 58 S140 36 160 22';
      const right = 'M31 87 C55 77 86 65 105 58 S155 52 194 57';
      const bed = (d) => line(d, ink, 16) + line(d, white, 11.5) + line(d, base, 5.2);
      let sleepers = '';
      [[33,86],[49,80],[66,74],[83,67],[101,60],[124,48],[141,36],[155,56],[173,56]].forEach(([x,y],i) => {
        sleepers += group(`translate(${x} ${y}) rotate(${i < 7 ? -22 : 0})`, line('M0-10v20', ink, 4));
      });
      const berth = (x,y,rotation,mark) => group(`translate(${x} ${y}) rotate(${rotation})`,
        rim('M-13-5Q-12-8-8-8H9Q12-8 13-5L14 6Q14 9 10 9H-10Q-14 9-14 6Z', accent) +
        (mark === 'triangle' ? path('M0-4l4 7h-8z',ink) : oval(0,0,3.8,3.8, ink)));
      const wagon = group('translate(86 53) rotate(-17)',
        oval(1, 12, 26, 4.5, ink, 'none', 0, 'opacity=".2"') +
        dot(-16, 9, 6.1, ink) + dot(14, 9, 6.1, ink) + dot(-16,9,2,white) + dot(14,9,2,white) +
        rim('M-25-11Q-25-15-20-16L13-18Q17-18 20-15L25-10V4Q25 9 19 10H-18Q-24 10-25 5Z', accent) +
        rim('M-24-12L-17-20Q-15-22-10-22L12-23Q16-23 18-20L24-12Q25-9 20-8L-18-6Q-23-6-24-9Z', white) +
        path('M-14-17l29-1 2 4-31 1z',base) +
        shade('M17-7l7-4v14q0 5-6 6h-4q3-3 3-7z') +
        (direction === 'a' ? line('M-19 2h18', ink, 2.1) : stamp(-9, 1, 0)) + pin(14, 0, accent) + shine('M-19-2h7'));
      return sleepers + bed(left) + bed(right) +
        // Preserve the open fork when the right branch overlaps the shared approach.
        line('M101 60q13-5 25-13',base,4.8) + line('M106 59q12-4 25-4',base,4.8) +
        berth(167,18,-27,'triangle') + berth(198,57,6,'circle') +
        speed('M38 50h14m-8-6h11') + wagon;
    }

    function table() {

(() => {
  'use strict';
  const {directions:d,games,gamesData,icon:i,esc,state:s,currentLeague,leagues,left,best,leagueScores,clock,gapLabel,shapeNames,frog,saved,stickers}=R;
  const attr=(name,v)=>v!==undefined?' data-'+name+'="'+esc(v)+'"':'';
  const buttonFace=(label,glyph='')=>'<span class="button-face">'+(glyph?i(glyph):'')+'<span>'+label+'</span></span>';
  const btn=(label,act,cls='outline',glyph='',value,extra='')=>'<button type="button" class="btn '+cls+'" data-do="'+act+'"'+attr('value',value)+' '+extra+'>'+buttonFace(label,glyph)+'</button>';
  const ib=(label,act,glyph,cls='icon-btn',value)=>'<button type="button" class="'+cls+'" data-do="'+act+'"'+attr('value',value)+' aria-label="'+esc(label)+'">'+i(glyph)+'</button>';
  const mark=t=>'<span class="wordmark logo-'+t+'" aria-label="Rivo">'+window.brandSymbol(t)+'<b>rivo</b><em aria-hidden="true">.</em></span>';
  const eyebrow=(ico,txt)=>'<span class="kicker">'+(ico?i(ico):'')+txt+'</span>';
  const title=(k,label)=>'<div class="section-title">'+(k?eyebrow('',k):'')+'<h1 tabindex="-1">'+label+'</h1></div>';
  const art=(game,t,mode)=>window.mechanicArt(game,t,mode);
  const gameArt=(game,theme,mode)=>theme==='a'?R.rebond.toyArt(game):art(game,theme,mode);
  const leadName=l=>l.opps[0]?.[0]||'';
  function topbar(t,view,l) {
    const major=['home','records','profile'].includes(view);
    return '<header class="topbar">'+(major?mark(t):ib('Retour','back','back'))+(major?'<button type="button" class="avatar-me" data-do="profile" aria-label="Ouvrir mon profil">'+esc((saved.name||'Alex').slice(0,1).toUpperCase())+'</button>':'<span class="context-name">'+esc(l.name)+'</span><span class="context-emblem">'+i(l.icon)+'</span>')+'</header>';
  }
  function nav(view) {
    return '<nav class="bottom" aria-label="Navigation principale">'+[['home','play','Jouer'],['records','rank','Classement'],['profile','user','Profil']].map(([k,g,label])=>'<button type="button" data-do="'+k+'"'+((k==='home'&&!['records','world','profile'].includes(view))||(k==='records'&&['records','world'].includes(view))||k===view?' aria-current="page"':'')+'><span>'+i(g)+'</span>'+label+'</button>').join('')+'</nav>';
  }
  function tabs(l) {
    const ordered=s.scenario==='rival'?[leagues.find(x=>x.id==='promo'),...leagues.filter(x=>x.id!=='promo')]:leagues;
    return '<div class="heading-line"><h1 tabindex="-1">Mes ligues</h1>'+ib('Gérer mes ligues','manage','plus')+'</div><div class="league-tabs" role="group" aria-label="Choisir une ligue">'+ordered.map(x=>'<button class="league-tab" type="button" data-do="switch" data-value="'+esc(x.id)+'" aria-pressed="'+(x.id===l.id)+'">'+i(x.icon)+'<span>'+esc(x.name)+'</span></button>').join('')+'</div>';
  }
  function socialRow(act,gl,title,sub) {
    return '<button class="link-row" type="button" data-do="'+act+'"><span class="tile-icon">'+i(gl)+'</span><span class="row-copy"><strong>'+title+'</strong><small>'+sub+'</small></span>'+i('arrow')+'</button>';
  }
  function home(t,l) {
    if(t==='a') return R.rebond.home(l);
    const n=left(l), runs=s.runs[l.id]||[], own=best(runs), lead=l.opps[0], gap=lead&&own&&own.hits===lead[1]?own.ms-lead[2]:null;
    const rival=s.scenario==='rival'&&l.id==='promo'&&n>0&&gap>0;
    const improved=runs.length>1&&runs.at(-1)&&best(runs.slice(0,-1))&&R.sortScores(runs.at(-1),best(runs.slice(0,-1)))<0;
    const mood=n===0&&improved?'win':rival?'lose':'focus';
    const allDone=leagues.every(group=>left(group)===0);
    const stateLabel=n===0?(allDone?'Journée terminée':'Défi terminé'):rival?'Revanche disponible':'Défi du jour';
    const time=lead?clock(lead[2]):'—';
    const status=n===0?'Essais terminés':n+' essai'+(n>1?'s':'')+' restant'+(n>1?'s':'');
    const line=rival?esc(lead[0])+' t’a passé de '+gapLabel(gap)+'. Ça pique.':n===0?(improved?'Record battu. Tu peux faire le malin.':'Tous les scores sont dans la ligue.'):'Trois wagons à diriger.';
    const action=n===0?'Voir le classement':rival?'Prendre ma revanche':'Jouer';
    const tag='<div class="hero-meta"><span class="hero-tag">'+i(n===0?'check':rival?'retry':'flag')+stateLabel+'</span><span class="level-tag">NIV. 1</span></div>';
    const gameLabel='<h2>Aiguillage</h2>';
    const target='<div class="target"><small>'+(!lead?'Premier score':n===0&&own?'Ton temps':'À battre')+'</small><strong class="digits">'+(n===0&&own?clock(own.ms):time)+'</strong></div>';
    return tabs(l)+'<article class="challenge '+(n===0?'settled':'')+'">'+tag+'<div class="hero-body"><div class="hero-type">'+gameLabel+target+'</div><div class="hero-art" aria-hidden="true">'+window.heroBackdrop(t)+frog(mood,'hero-frog')+'</div></div><p class="hero-line">'+line+'</p><div class="hero-bottom">'+btn(action,n===0?'league':'play','primary wide',n===0?'rank':'play')+'<div class="hero-foot">'+i(n===0?'check':'ticket')+status+'</div></div></article>'+
    '<div class="heading-line subsection"><h2>Dans la ligue</h2><span class="member-count">'+i('people')+l.count+'</span></div><div class="community">'+socialRow('league','rank','Résultats des amis',lead?esc(lead[0])+' mène en '+clock(lead[2]):'Le premier score t’attend')+socialRow('chat','chat','Chat de ligue',esc(l.name))+'</div>'+
    '<div class="quiet-actions">'+btn('Créer une ligue','create','text','plus')+btn('Inviter','invite','text','link')+'</div>';
  }
  function scoreList(l,own,animate=false) {
    const list=leagueScores(l,own);
    if(!list.length)return '<p class="empty">Le classement s’ouvre avec le premier score de la ligue.</p>';
    return '<ol class="score-list '+(animate?'rank-intro':'')+'">'+list.map(r=>'<li class="'+(r.you?'you':'')+'"><span class="place">'+r.rank+'</span><span class="player"><strong>'+esc(r.name)+'</strong><small>'+r.hits+'/3 quais</small></span><b class="digits">'+clock(r.ms)+'</b></li>').join('')+'</ol>';
  }
  function league(t,l) {
    const own=best(s.runs[l.id]||[]);
    const available=left(l)>0;
    const earlyAction=t==='a'&&available;
    const playButton=available?btn(own?'Jouer un essai':'Jouer','play','primary wide','play'):
      btn('S’entraîner','practice','outline wide','retry');
    const members=l.count+' membre'+(l.count>1?'s':'');
    return `
      ${title('Ligue entre amis',esc(l.name))}
      <section class="league-banner">
        <div>${eyebrow('flag','Défi du jour')}<h2>Aiguillage</h2><p>${members} · Niveau 1</p></div>
        <div class="banner-art">${gameArt('aiguillage',t)}</div>
      </section>
      ${earlyAction?'<div class="league-action">'+playButton+'</div>':''}
      <div class="duo">${btn('Ouvrir le chat','chat',t==='a'?'outline':'primary','chat')}${btn('Inviter','invite','outline','link')}</div>
      <div class="heading-line subsection"><h2>Résultats du jour</h2>${i('rank')}</div>
      ${scoreList(l,own)}
      ${own?'':'<p class="empty"><b>Toi</b> · Ton premier score t’attend.</p>'}
      ${earlyAction?'':playButton}`;
  }
  const tabsLevel=()=>'<div class="levels" role="group" aria-label="Niveau">'+[1,2,3].map(k=>'<button type="button" data-do="level" data-value="'+k+'" aria-pressed="'+(k===s.level)+'">Niveau '+k+'</button>').join('')+'</div>';
  const num=n=>new Intl.NumberFormat('fr-FR').format(n);
  function records(t) {
    const list=Object.keys(gamesData).filter(game=>s.recordGame==='all'||s.recordGame===game);
    const cards = list.map(game=>{
      const record=gamesData[game].levels[s.level];
      const local=game==='aiguillage' && s.level===1 && s.globalBest;
      const score=local?s.globalBest.hits+'/3 · '+clock(s.globalBest.ms):record?.[2];
      const thumb=gameArt(game,t,'hero');
      const content=`<span class="record-thumb">${thumb}</span><span class="record-copy">
        <strong>${games[game]}</strong>${record?'<span class="record-metric"><small>Record</small><b class="digits">'+score+'</b></span>':'<small>Niveau à jouer</small>'}</span>`+
        (record?`<span class="record-ranking"><b class="digits">Nº ${num(record[0])}</b><small>${local?'Dernier rang':'Mondial'}</small></span>`:'');
      return `<article class="record-card ${record?'':'unplayed'}">${record?
        '<button type="button" class="record-open" data-do="world" data-value="'+game+'">'+content+'</button>':
        '<div class="record-open">'+content+'</div>'}</article>`;
    }).join('');
    return '<div class="section-title records-title"><h1 tabindex="-1">Classement</h1></div>'+
      tabsLevel()+'<div class="record-toolbar"><span>'+i('globe')+'Jeux déjà joués</span>'+
      '<label class="select-game"><span class="sr">Filtrer par mini-jeu</span><select data-input="record-game">'+
      '<option value="all">Tous les jeux</option>'+Object.keys(gamesData).map(game=>'<option value="'+game+'" '+(s.recordGame===game?'selected':'')+'>'+games[game]+'</option>').join('')+
      '</select></label></div><div class="records">'+cards+'</div><p class="footnote">Classements mondiaux simulés pour le prototype.</p>';
  }
  function world(t) {
    const key=s.worldGame, r=gamesData[key]?.levels[s.level];
    if(!r)return records(t);
    const nearby=(delta)=>{
      const parts=r[2].match(/^(.* · )([\d,]+) s$/);
      if(parts)return parts[1]+clock((parseFloat(parts[2].replace(',','.'))+delta*.1)*1000);
      return r[2].replace(/^\d+/,n=>String(+n-delta));
    };
    const fresh=key==='aiguillage'&&s.level===1&&s.globalBest;
    return title('Classement mondial',games[key])+'<div class="league-banner world-banner"><div>'+eyebrow('globe','Niveau '+s.level)+'<h2>Nº '+num(r[0])+'</h2><p>sur '+num(r[1])+' joueurs</p></div><div class="banner-art">'+gameArt(key,t)+'</div></div><div class="heading-line subsection"><h2>Autour de toi</h2></div><ol class="score-list">'+[-1,0,1].map((z,j)=>'<li class="'+(z===0?'you':'')+'"><span class="worldplace digits">'+num(r[0]+z)+'</span><strong>'+['Nina','Toi','Eden'][j]+'</strong><b>'+nearby(z)+'</b></li>').join('')+'</ol>'+(fresh?'<p class="empty">Ton nouveau record local attend son rang mondial.</p>':'')+'<p class="footnote">Classement simulé · '+games[key]+' · Niveau '+s.level+'</p>'+btn('Mes records','records','outline wide','back');
  }
  const paths={circle:'M150 10v16q0 18-19 27L65 85q-18 9-18 27v11',triangle:'M150 10v113',square:'M150 10v16q0 18 19 27l66 32q18 9 18 27v11'};
  function tracks(choice) {
    const end={circle:47,triangle:150,square:253};
    const still=R.options.reduced||matchMedia('(prefers-reduced-motion: reduce)').matches;
    const vehicle=choice?'<g class="moving-wagon" '+(still?'transform="translate('+end[choice]+' 123)"':'')+'>'+(still?'':'<animateMotion dur="0.26s" path="'+paths[choice]+'" fill="freeze"/>')+'<rect x="-11" y="-8" width="22" height="14" rx="4" fill="var(--accent)" stroke="var(--ink)" stroke-width="2"/><circle cx="-6" cy="7" r="3" fill="var(--ink)"/><circle cx="6" cy="7" r="3" fill="var(--ink)"/><rect x="-5" y="-5" width="10" height="3" rx="1.5" fill="white"/></g>':'';
    return '<svg class="tracks" viewBox="0 0 300 135" aria-hidden="true">'+Object.values(paths).map(p=>'<path class="bed" d="'+p+'"/>').join('')+Object.values(paths).map(p=>'<path class="line" d="'+p+'"/>').join('')+Object.values(paths).map(p=>'<path class="ties" d="'+p+'"/>').join('')+(choice?'<path class="chosen" d="'+paths[choice]+'"/>':'')+vehicle+'</svg>';
  }
  const sampleGame=()=>({seq:['triangle','circle','square'],step:1,log:[{expected:'triangle',choice:'triangle',ms:2700}],total:2700,locked:false,started:0,practice:true,demo:true,last:'Wagon 1 · Bon quai',lastOk:true});
  const sampleResult=()=>({hits:3,ms:8600,log:[{expected:'triangle',choice:'triangle',ms:2100},{expected:'circle',choice:'circle',ms:3900},{expected:'square',choice:'square',ms:2600}],practice:false,sample:true});
  const hits=g=>g.log.filter(x=>x.choice===x.expected).length;
  function gameView(t,l,g=s.game||sampleGame()) {
    if(t==='a') return R.rebond.game(g);
    const symbol=g.seq[g.step], last=g.locked?g.log.at(-1):null;
    return title('Défi du jour','Aiguillage')+'<p class="intro-rule">Envoie le wagon au quai de même forme.</p><div class="game-meta"><span>'+i('flag')+'Wagon '+(g.step+1)+' / 3</span><b class="digits" data-clock>'+clock(g.total)+'</b></div><div class="progress" aria-label="'+g.step+' wagons terminés sur 3">'+[0,1,2].map(k=>'<b class="'+(k<g.step?'counted':k===g.step?'current':'')+'"></b>').join('')+'</div><div class="track-board"><div class="wagon"><span>'+i(symbol)+'</span><strong>Wagon '+shapeNames[symbol].toLowerCase()+'</strong><b aria-hidden="true"></b></div>'+tracks(last?.choice)+'<div class="platforms" aria-hidden="true">'+Object.keys(shapeNames).map(k=>'<span class="'+(last?.choice===k?'lit':'')+'">'+i(last?.choice===k?(g.lastOk?'check':'close'):k)+'</span>').join('')+'</div></div><div class="choices" role="group" aria-label="Choisir un quai">'+Object.entries(shapeNames).map(([k,name])=>'<button type="button" data-do="answer" data-value="'+k+'" '+(g.locked?'aria-disabled="true"':'')+' class="choice '+(last?.choice===k?'chosen':'')+'">'+i(k)+'<span>'+name+'</span></button>').join('')+'</div><div class="game-feedback">'+i(g.last?g.lastOk?'check':'close':'flag')+'<span>'+esc(g.last||'Choisis un quai.')+'</span></div><div class="game-total"><span>'+hits(g)+'/3 bons quais</span><span>'+(g.practice&&!g.demo?'Entraînement':'Essai classé')+'</span></div>';
  }
  function situationResult(t,l,r=s.result||sampleResult()) {
    const rival=l.opps[0];
    const rivalName=esc(leadName(l));
    const ranked=!r.practice;
    const delta=rival&&r.hits===rival[1]?r.ms-rival[2]:null;
    const behind=ranked&&delta!==null&&delta>0;
    const close=behind&&delta<=1000;
    const record=ranked&&s.record&&!r.sample;
    const place=leagueScores(l,r).find(row=>row.you)?.rank||1;
    const first=ranked&&place===1;
    const remaining=left(l);
    const titleText=behind?'À '+gapLabel(delta):r.practice?'Bien joué !':first?'En tête !':record?'Record battu !':'Partie terminée';
    const description=behind?'derrière '+rivalName:r.practice?'Entraînement terminé':r.hits+' bons quais sur 3';
    const action=r.practice?'practice':remaining?'play':'league';
    const label=r.practice?'Rejouer en entraînement':remaining?(first?'Améliorer mon chrono':'Prendre ma revanche'):'Voir le classement';
    const quote=close?'Ça pique.':first?'À eux de te rattraper.':record?'Tu peux faire le malin.':r.practice?'Encore un tour ?':'Je sens venir la revanche.';
    const pose=close?'lose':first||record?'win':ranked?'lose':'focus';
    const bestInLeague=best([...(s.runs[l.id]||[]),r]);
    const showReview=r.practice||remaining===0;
    const firstWrong=r.log.findIndex(item=>item.choice!==item.expected);
    const slowest=r.log.reduce((max,item,j,list)=>max<0||item.ms>list[max].ms?j:max,-1);
    const tip=firstWrong>=0?'Premier écart au wagon '+(firstWrong+1)+'.':
      slowest>=0?'Le wagon '+(slowest+1)+' t’a pris le plus de temps.':'Le nombre de bons quais départage les scores, puis le chrono.';
    const cardBadge=r.practice?'Entraînement':record?'Record personnel':place===1?'1ʳᵉ place':place+'ᵉ place';
    const crest=t==='a'?'<span class="reaction-perch"></span>':window.heroBackdrop(t);
    return `
      ${title('Aiguillage · Niveau 1','Ton résultat')}
      <section class="finish">
        <div class="finish-type">
          ${eyebrow(record||first?'medal':'flag',cardBadge)}
          <h2>${titleText}</h2><strong>${description}</strong><p>« ${quote} »</p>
        </div>
        <div class="finish-art" aria-hidden="true">${crest}${frog(pose,'finish-frog'+(record?' record-frog':''))}</div>
      </section>
      <div class="score-pair"><div><small>Ton chrono</small><strong class="digits">${clock(r.ms)}</strong></div>
      <div><small>Quais corrects</small><strong class="digits">${r.hits}/3</strong></div></div>
      ${btn(label,action,'primary wide result-action',action==='league'?'rank':'retry')}
      ${ranked&&remaining?'<p class="result-remaining">'+remaining+(remaining===1?' essai classé restant':' essais classés restants')+'</p>':''}
      ${ranked?'<div class="heading-line subsection"><h2>Dans la ligue</h2>'+i('rank')+'</div>'+scoreList(l,bestInLeague,true):''}
      <div class="result-links">${btn('Ouvrir le chat','chat','outline wide','chat')}</div>
      <div class="review"><b>Pour progresser</b><p>${showReview?tip:'À nombre de bons quais égal, le chrono départage.'}</p>${
        showReview&&r.log.length?'<details><summary>Revoir les wagons</summary>'+r.log.map((item,j)=>'<p>'+i(item.expected===item.choice?'check':'close')+'Wagon '+(j+1)+' · '+shapeNames[item.choice]+' · '+clock(item.ms)+'</p>').join('')+'</details>':''
      }</div>`;
  }
  function rules(t,l){
    const shapes=t==='a'?'<div class="rule-shapes" aria-hidden="true">'+Object.keys(shapeNames).map(shape=>'<span>'+i(shape)+'</span>').join('')+'</div>':'';
    return `
      ${title(s.practice?'Entraînement':'Défi de '+esc(l.name),'Aiguillage')}
      <section class="rule-sheet">
        <div class="rule-illustration">${gameArt('aiguillage',t)}${shapes}</div>
        <h2>Un wagon, un symbole.</h2>
        <p class="intro-rule">Touche le quai qui porte la même forme que le wagon.</p>
      </section>
      <div class="review"><b>Trois wagons à diriger</b><p>Le nombre de bons quais compte en premier. À égalité, le temps de décision départage.</p></div>
      ${btn('Démarrer','start','primary wide','play')}
      <p class="footnote">${s.practice?'Essai libre · Hors classement':'Essai classé '+(3-left(l))+' sur 2'}</p>`;
  }
  function chat(t,l) {
    const messages=Array.isArray(saved.chats?.[l.id])?saved.chats[l.id]:[];
    const intro=l.opps.length?'<div class="chat-bubble"><b>'+esc(leadName(l))+'</b><p>Qui vient chercher mon chrono ?</p></div>':'';
    const history=messages.map(message=>`<div class="chat-bubble mine">
      <b>Toi</b>${Object.hasOwn(stickers,message.sticker)?
        frog(message.sticker,'chat-frog')+'<p>'+stickers[message.sticker]+'</p>':'<p>'+esc(message.text)+'</p>'}
    </div>`).join('');
    return `
      ${title('Chat de ligue',esc(l.name))}
      <div class="chat-stream" aria-live="polite">${intro+history||'<p class="empty">Lance la conversation.</p>'}</div>
      <div class="chat-actions">
        ${btn('Stickers','stickers','outline','spark')}
        <form data-form="chat">
          <label class="sr" for="chat-message">Message à la ligue</label>
          <input id="chat-message" required maxlength="240" placeholder="Ton message…" autocomplete="off">
          <button type="submit" class="icon-btn send" aria-label="Envoyer le message">${i('send')}</button>
        </form>
      </div>
      <p class="footnote">Messages de démo conservés sur cet appareil.</p>`;
  }
  function profile(t){
    return `
      ${title('Profil','Mon vestiaire')}
      <section class="profile-hero">
        <div class="profile-art">${frog(saved.pose||'focus')}</div>
        <div class="profile-copy"><b>${esc(saved.name||'Alex')}</b><small>${leagues.length} ligues</small></div>
      </section>
      ${btn('Personnaliser','identity','outline wide','user')}
      <div class="heading-line subsection"><h2>Préférences</h2></div>
      ${socialRow('settings','settings','Son et mouvements','Silence, vibrations et mouvement réduit')}`;
  }
  function styleBoard(t){
    const a=d[t];
    const sw=[[a.main,'Surface'],[a.accent,'Action'],[a.ink,'Encre'],['#FFFFFF','Respiration']];
    return '<div class="style-head">'+mark(t)+'<div>'+eyebrow('','Direction '+t.toUpperCase())+'<h1>'+a.name+'</h1></div></div><div class="style-body"><h2>Palette</h2><div class="swatches">'+sw.map(([c,n])=>'<div><b style="background:'+c+'"></b><small>'+n+'</small><code>'+c+'</code></div>').join('')+'</div><h2>Commandes</h2><div class="spec-buttons">'+btn('Jouer','noop','primary','play')+btn('Choisi','noop','outline selected','check')+btn('Chargement','noop','outline','timer',undefined,'aria-busy="true"')+btn('Indisponible','noop','outline','',undefined,'disabled')+'</div><h2>Carte de résultat</h2><div class="mini-result"><span>'+i('rank')+'2ᵉ place</span><b class="digits">8,6 s</b></div><div class="type-sample"><h2>Typographies</h2><strong class="display-type">Aiguillage</strong><p>'+a.type+' · Titres</p><p>Nunito · Texte &nbsp; <b class="digits">08,6</b> · Chiffres</p></div><h2>Bannières</h2><div class="style-banners">'+a.pair.map(k=>'<div>'+art(k,t)+'<b>'+games[k]+'</b></div>').join('')+'</div><details class="more-games"><summary>Les quatre autres mini-jeux</summary><div class="style-banners">'+Object.keys(games).filter(k=>!a.pair.includes(k)).map(k=>'<div>'+art(k,t)+'<b>'+games[k]+'</b></div>').join('')+'</div></details></div>';
  }
  function phone(t,view=s.view,flags={}) {
    const l=currentLeague();
    if(view==='style')return '<section class="phone style-phone dir-'+t+'" data-theme="'+t+'">'+styleBoard(t)+'</section>';
    const funcs={home,league,records,world,game:gameView,result:situationResult,chat,profile,rules};
    return '<section class="phone dir-'+t+'" data-theme="'+t+'" aria-label="Direction '+t.toUpperCase()+' · '+d[t].name+'">'+topbar(t,view,l)+'<div class="phone-scroll"><div class="content view-'+view+'">'+(funcs[view]||home)(t,l)+'<p class="ui-error" role="alert" hidden></p></div></div>'+nav(view)+'</section>';
  }
  Object.assign(R,{btn,buttonFace,ib,mark,eyebrow,phone,styleBoard,sampleGame,sampleResult,gameView});
})();

    const button=event.target.closest('.dir-a .btn:is(.primary,.outline), .dock-control');
    if(!button||button.disabled||button.getAttribute('aria-disabled')==='true')return;
    press={button,pointerId:event.pointerId};
    button.classList.add('is-pressed');
  });
  document.addEventListener('pointerup',releasePress);
  document.addEventListener('pointercancel',releasePress);
  window.addEventListener('blur',()=>releasePress());

  document.addEventListener('click',e=>{
    const b=e.target.closest('button[data-do]');if(!b||b.disabled)return;
    const action=b.dataset.do,value=b.dataset.value;
    if(s.mode==='compare'&&b.closest('figure .phone')){
      const k=b.closest('.phone').dataset.theme;s.mode='try';s.theme=k;direct(s.compareView);
      const fresh=[...stage.querySelectorAll('button[data-do]')].find(x=>x.dataset.do===action&&x.dataset.value===value);
      if(fresh)handle(action,value,fresh);return;
    }
    handle(action,value,b);
  });
  document.addEventListener('change',e=>{
    const el=e.target,k=el.dataset.input,v=el.value;
    if(el.dataset.opt){if(el.dataset.opt==='fail')s.fail=el.checked;else{o[el.dataset.opt]=el.checked;saved.options=o;save();document.body.classList.toggle('reduce',o.reduced)}return}
    if(k==='scenario'){leave(()=>scenario(v));return}
    if(k==='scene'){leave(()=>{if(s.mode==='compare'){s.compareView=v;closeDialog();display()}else direct(v)});return}
    if(k==='vision'){s.perception=v;closeDialog();display();return}
    if(k==='record-game'){if(el.closest('figure')){s.theme=el.closest('figure').dataset.figure;s.mode='try';s.view='records'}s.recordGame=v;display();return}
    if(k?.startsWith('test-')||k?.startsWith('task-')||k?.startsWith('pref-')){
      const st=saved.tests??={};if(k==='test-order')st.order=v;else if(k==='test-dir')st.dir=v;else if(k.startsWith('task-'))st[(st.dir||s.theme)+k.slice(5)]=v;else st['pref'+k.slice(5)]=v;
      save();if(k==='test-dir')test();
    }
  });
  document.addEventListener('submit',e=>{
    const form=e.target,type=form.dataset.form;if(!type)return;e.preventDefault();
    const raw=new FormData(form);
    if(type==='chat'){const val=form.querySelector('input').value.trim();if(val){addMessage({text:val.slice(0,240)});stage.querySelector('#chat-message')?.focus()}return}
    if(type==='identity'){const n=String(raw.get('name')||'').trim();if(!n){msg('Indique un prénom.');return}saved.name=n.slice(0,24);save();closeDialog();display();return}
    if(type==='join'){const val=String(raw.get('code')||'').trim().toUpperCase(),l=leagues.find(x=>x.code===val);if(!l){msg('Code inconnu sur cet appareil. Vérifie le code.');return}switchLeague(l.id);return}
    if(type==='create'){const name=String(raw.get('name')||'').trim().slice(0,70);if(!name){msg('Indique un nom de ligue.');return}
      let code;do{code=Math.random().toString(36).slice(2,8).toUpperCase()}while(!code||leagues.some(x=>x.code===code));
      const l={id:'club-'+code.toLowerCase(),name,code,icon:'flag',count:1,opps:[]};leagues.push(l);(saved.custom??=[]).push({name,code,id:l.id});save();s.runs[l.id]=[];switchLeague(l.id);invite();
    }
  });
  if(q.get('vue')==='style')s.mode='style';
  if(Object.hasOwn(names,q.get('vue'))){s.view=q.get('vue');if(s.view==='result')recordDemo();if(s.view==='game'){s.game=sampleGame();s.game.started=performance.now();if(!s.capture)s.game.demo=false}}
  if(q.get('mode')==='comparer'){s.mode='compare';s.compareView=Object.hasOwn(names,s.view)?s.view:'home'}
  if(Object.hasOwn(perceptions,q.get('vision')))s.perception=q.get('vision');
  display();
})();
</script>
